name: Hello CI
on:
  push:
    branches: [master,main]
  pull_request:
    branches: [master,main]
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello from GitHub Actions!"
      - name: Show files
        run: ls -la